    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var a = document.createElement('a');
          a.href = l.href;
          var decodedPath = decodeURIComponent(l.search.slice(3).split('&')[0]).replace(/~and~/g, '&');
          window.history.replaceState(null, null,
            a.pathname.slice(0, -1) + decodedPath + l.hash
          );
        }
      }(window.location));
    </script>
