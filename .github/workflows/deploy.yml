name: Deploy to GitHub Pages

# Define quando esse script vai rodar
on:
  push:
    branches: ['main'] # Substitua por 'master' se for o nome da sua branch principal
  workflow_dispatch: # Permite rodar o botão de deploy manualmente no GitHub

# Permissões necessárias para o script publicar o site
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dois deploys rodem ao mesmo tempo e quebrem o site
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Trabalho 1: Preparar e compilar o código (Build)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Versão do Node. Pode ajustar se usarem outra.
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Fazer o Build do Vite
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Fazer upload da pasta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Caminho da pasta que o Vite gera

  # Trabalho 2: Pegar o que foi compilado e publicar (Deploy)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # Garante que o deploy só roda se o build der certo
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4